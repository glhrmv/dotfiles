theme = "gruvbox"

[editor]
bufferline = "always"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.indent-guides]
render = true

[keys.normal]
C-h = ":buffer-previous"
C-l = ":buffer-next"
C-w = ":buffer-close"
"A-h" = "jump_view_left"
"A-l" = "jump_view_right"
"A-j" = "jump_view_down"
"A-k" = "jump_view_up"
